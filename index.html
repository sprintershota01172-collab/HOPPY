<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f1f0eb">
  <meta name="description" content="夫婦で育てる家探しノート。物件記録と納得できる比較を、ひとつに。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ほっぽさん">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>ほっぽさん | 家探しノート</title>
</head>
<body>
  <div id="app" class="app-shell">
    <div class="boot"><span class="brand-mark">H.</span><strong>ほっぽさん</strong><small>わたしたちの家探し</small></div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!refreshing) {
          refreshing = true;
          location.reload();
        }
      });
    }
  </script>
  <script src="./app.js" defer></script>
</body>
</html>
