name: FP finance regression
on:
  push:
    paths:
      - app.js
      - 'tests/*.cjs'
      - .github/workflows/finance-check.yml
  pull_request:
    paths:
      - app.js
      - tests/finance.test.cjs
      - .github/workflows/finance-check.yml
jobs:
  finance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check financial calculations
        run: node --test tests/finance.test.cjs tests/fp-visual-r71.cjs tests/fp-budget-year-fixed-r72.cjs
