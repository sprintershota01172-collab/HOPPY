name: 駅・路線データ更新

# 国土数値情報（鉄道データ N02、登録不要）から愛知・岐阜周辺の駅と路線を集計。手動と毎月1日に実行。
on:
  workflow_dispatch:
  schedule:
    - cron: '33 21 1 * *'

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch stations
        id: fetch
        run: node scripts/fetch-stations.mjs
      - name: Commit when changed
        id: commit
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name "hoppy-landprice-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stations.json
          if git diff --cached --quiet; then echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "駅・路線データ更新 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Publish to GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
