name: Deploy HOPPY to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Verify app syntax and phase 1 flows
        run: |
          node --check app.js
          node tests/smoke.cjs
          node tests/no-flash.cjs
          node tests/offline.cjs
          node tests/memo-swipe.cjs
          node tests/fp-budget.cjs
          node tests/fp-capacity-startup.cjs
          node tests/fp-viewport.cjs
          node tests/fp-tabs-align.cjs
          node tests/fp-education-clarity.cjs
          node tests/fp-goal-targets.cjs
          node tests/fp-interest-surplus.cjs
          node tests/fp-ledger.cjs
          node tests/fp-safety.cjs
          node tests/fp-report.cjs
          node tests/fp-history-events.cjs
          node tests/fp-income.cjs
          node tests/fp-month-assets.cjs
          node tests/fp-breakdown-sheet.cjs
          node tests/fp-stable-breakdown.cjs
          node tests/fp-yen-focus.cjs
          node tests/fp-purchase-month.cjs
          node tests/home-axis.cjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
