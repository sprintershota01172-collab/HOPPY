name: Verify and deploy HOPPY

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate, publish, then verify the live site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify application before deployment
        run: |
          node --version
          node --check app.js
          node --check sw.js
          node scripts/verify-release.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble one consistent release
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='scripts' ./ _site/
          node -e 'const fs=require("fs");const p="_site/release.json";const j=JSON.parse(fs.readFileSync(p,"utf8"));j.commit=process.env.GITHUB_SHA;j.publishedAt=new Date().toISOString();fs.writeFileSync(p,JSON.stringify(j,null,2)+"\n");'
          test -s _site/diagnose.html
          test -s _site/index.html
          RELEASE_VERSION=$(node -p 'require("./release.json").version')
          test -s "_site/visual-$RELEASE_VERSION.html"
          test -s _site/app.js
          test -s _site/styles.css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the actual public website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          RELEASE_VERSION=$(node -p 'require("./release.json").version')
          node scripts/check-public.mjs "$SITE_URL" "$RELEASE_VERSION" "$GITHUB_SHA"
