name: 地価調べ君 check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          node --check app.js
          node --check sw.js
          node scripts/verify-release.mjs
          node --test tests/landprice.test.cjs
