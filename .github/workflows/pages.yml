name: Deploy HOPPY to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Verify app syntax and phase 1 flows
        run: |
          node --check app.js
          failed=0
          for test_file in tests/*.cjs; do
            echo "::group::${test_file}"
            node "$test_file" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
